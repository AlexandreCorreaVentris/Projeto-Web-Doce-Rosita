
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rosita Doces Artesanais | Abertura Mágica</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap"
      rel="stylesheet">

      <!-- Prepara a navegação para a página principal -->
    <link rel="prefetch" href="./inicio.html" as="document">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #29000b;
            font-family: Georgia, serif;
        }

        .abertura {
            position: fixed;
            inset: 0;
            overflow: hidden;
            isolation: isolate;
            background:
                radial-gradient(ellipse at 50% 48%,
                    #8d1b36 0%,
                    #56071e 45%,
                    #26000a 100%);
        }

        .abertura::before {
            content: "";
            position: absolute;
            inset: -20%;
            background:
                radial-gradient(circle,
                    rgba(255, 194, 91, .14),
                    transparent 55%);
            animation: respirar 4s ease-in-out infinite alternate;
        }

        @keyframes respirar {
            from { transform: scale(.85); opacity: .4; }
            to { transform: scale(1.15); opacity: 1; }
        }

        /* CANVAS DOS BRILHOS E ROJÃO */

        #magia {
            position: absolute;
            inset: 0;
            z-index: 5;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* CORAÇÃO GRANDE */

        .coracao {
            position: absolute;
            z-index: 2;
            width: min(94vw, 950px);
            height: min(88vh, 800px);
            left: 50%;
            top: 48%;
            transform: translate(-50%, -50%);
            overflow: visible;
        }

        #caminhoCoracao {
            fill: none;
            stroke: #ffd67c;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter:
                drop-shadow(0 0 5px #ffe5a2)
                drop-shadow(0 0 15px #ff9c38);
            opacity: 0;
        }

        .coracao.pronto #caminhoCoracao {
            animation: pulsar 1.1s ease-in-out infinite alternate;
        }

        @keyframes pulsar {
            from {
                stroke-width: 3;
                filter: drop-shadow(0 0 7px #ffd67c);
            }

            to {
                stroke-width: 5;
                filter:
                    drop-shadow(0 0 12px #fff1b4)
                    drop-shadow(0 0 24px #ff9c38);
            }
        }

        /* BORBOLETA */

        .borboleta {
            position: fixed;
            z-index: 8;
            width: 76px;
            height: 65px;
            left: 0;
            top: 0;
            opacity: 0;
            pointer-events: none;
            filter:
                drop-shadow(0 0 8px #ffe39a)
                drop-shadow(0 0 20px #ffa53a);
            will-change: transform;
        }

        .borboleta svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .asa-esquerda {
            transform-origin: 48px 35px;
            animation: baterEsquerda .22s ease-in-out infinite alternate;
        }

        .asa-direita {
            transform-origin: 48px 35px;
            animation: baterDireita .22s ease-in-out infinite alternate;
        }

        @keyframes baterEsquerda {
            from { transform: scaleX(1); }
            to { transform: scaleX(.38); }
        }

        @keyframes baterDireita {
            from { transform: scaleX(1); }
            to { transform: scaleX(.38); }
        }

        /* LOGOTIPO VERDADEIRO */

        .logo {
            position: absolute;
            z-index: 4;
            left: 50%;
            top: 48%;
            width: min(66vw, 450px);
            max-height: 68vh;
            object-fit: contain;

            opacity: 0;
            transform: translate(-50%, -50%) scale(.45);

            filter:
                drop-shadow(0 0 18px #ffc65e80);

            transition:
                opacity 1s ease,
                transform 1.3s cubic-bezier(.2, .8, .2, 1),
                filter 1s ease;
        }

        .logo.revelado {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            filter:
                drop-shadow(0 0 20px #ffd16d);
        }

        .logo.portal {
            transform: translate(-50%, -50%) scale(3.5);
            opacity: 0;
            filter: drop-shadow(0 0 65px #fff2b8);
            transition: transform 1.2s ease-in, opacity 1.2s ease-in;
        }

        /* PEQUENOS CORAÇÕES */

        .mini-coracao {
            position: fixed;
            z-index: 6;
            color: #ffb7a6;
            font-size: var(--tamanho);
            left: var(--x);
            top: var(--y);
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 12px #ff7c77;

            animation: coracaoFlutuar
                var(--duracao) ease-in-out
                var(--atraso) infinite;
        }

        @keyframes coracaoFlutuar {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(.5);
            }

            45% { opacity: .9; }

            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.2);
            }
        }

        /* TEXTO */
        /* ASSINATURA DA MARCA ROSITA */

.frase {
    position: absolute;
    z-index: 9;

    left: 50%;
    bottom: 5%;
    width: 95%;

    transform: translateX(-50%);
    text-align: center;

    font-family: "Berkshire Swash", Georgia, serif;
    font-size: clamp(28px, 3.5vw, 48px);
    font-weight: 400;
    font-style: normal;
    letter-spacing: 0.5px;
    line-height: 1.4;

    /* Interior vinho, inspirado no emblema */
    color: #8b102b;

    /* Contorno dourado */
    -webkit-text-stroke: 1.2px #ffe2a0;

    /* Relevo e brilho */
    text-shadow:
        1px 2px 0 #4a0616,
        2px 3px 0 #d4a044,
        0 0 8px rgba(255, 215, 125, 0.8),
        0 0 20px rgba(255, 193, 75, 0.45);

    opacity: 0;
    transition: opacity 1s ease;
}

        .frase.visivel {
            opacity: 1;
        }

        /* TRANSIÇÃO FINAL */

        .transicao {
            position: absolute;
            inset: 0;
            z-index: 15;
            pointer-events: none;
            background: radial-gradient(
                circle at center,
             #8d1b36 0%,
             #56071e 55%,
             #26000a 100%
            );
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .transicao.ativa {
            opacity: 1;
        }

        .pular {
            position: absolute;
            z-index: 20;
            right: 22px;
            top: 20px;
            padding: 11px 20px;
            color: #ffe9b4;
            background: #30000dcc;
            border: 1px solid #d9b25e;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
        }

        .pular:hover {
            background: #d9b25e;
            color: #30000d;
        }

        @media (max-width: 600px) {
            .coracao {
                width: 98vw;
                height: 70vh;
            }

            .logo {
                width: 76vw;
            }

            .borboleta {
                width: 55px;
                height: 48px;
            }

            .frase {
                bottom: 10%;
                letter-spacing: 1px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .asa-esquerda,
            .asa-direita,
            .mini-coracao {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <main class="abertura" id="abertura">

        <!-- CORAÇÃO MAIOR -->
        <svg class="coracao"
             id="coracao"
             viewBox="0 0 500 500"
             preserveAspectRatio="xMidYMid meet"
             aria-hidden="true">

            <path id="caminhoCoracao"
                d="M 250 405
                   C 210 370, 45 265, 45 165
                   C 45 48, 195 45, 250 140
                   C 305 45, 455 48, 455 165
                   C 455 265, 290 370, 250 405"/>
        </svg>

        <!-- BORBOLETA DOURADA -->
        <div class="borboleta" id="borboleta"
             aria-hidden="true">

            <svg viewBox="0 0 100 75">

                <g class="asa-esquerda">
                    <path
                        d="M48 35 C12 -12,-5 10,16 37
                           C-3 55,25 79,48 40Z"
                        fill="#ffcc64"
                        stroke="#fff1ba"
                        stroke-width="2"/>
                    <path
                        d="M43 33 C15 2,10 18,26 36"
                        fill="none"
                        stroke="#fff8d6"
                        stroke-width="2"/>
                </g>

                <g class="asa-direita">
                    <path
                        d="M52 35 C88 -12,105 10,84 37
                           C103 55,75 79,52 40Z"
                        fill="#ff9b45"
                        stroke="#fff1ba"
                        stroke-width="2"/>
                    <path
                        d="M57 33 C85 2,90 18,74 36"
                        fill="none"
                        stroke="#fff8d6"
                        stroke-width="2"/>
                </g>

                <ellipse cx="50" cy="39" rx="3" ry="20"
                         fill="#fff2b2"/>

                <path d="M49 22 Q40 8 35 10
                         M51 22 Q60 8 65 10"
                      stroke="#ffe9a8"
                      stroke-width="2"
                      fill="none"/>
            </svg>
        </div>

        <!-- LOGOTIPO ORIGINAL -->
        <img
            class="logo"
            id="logo"
            src="./imagens/rosita_logo_transparente.png"
            alt="Rosita Doces Artesanais — Desde 2024">

        <!-- BRILHOS E EXPLOSÃO -->
        <canvas id="magia" aria-hidden="true"></canvas>

        <!-- CORAÇÕES FLUTUANTES -->
        <div id="coracoes" aria-hidden="true"></div>

        <!-- FRASE -->
        <p class="frase" id="frase">
            Onde o amor ganha sabor.
        </p>

        <!-- TRANSIÇÃO -->
        <div class="transicao" id="transicao"></div>

        <!-- ENTRADA DIRETA -->
        <a class="pular" href="./inicio.html">
            Pular animação
        </a>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const canvas = document.getElementById("magia");
            const ctx = canvas.getContext("2d");

            const svg = document.getElementById("coracao");
            const caminho = document.getElementById("caminhoCoracao");
            const borboleta = document.getElementById("borboleta");
            const logo = document.getElementById("logo");
            const frase = document.getElementById("frase");
            const transicao = document.getElementById("transicao");
            const coracoes = document.getElementById("coracoes");

            const duracaoVoo = 3500;
            const inicioVoo = performance.now() + 400;

            const comprimento = caminho.getTotalLength();

            caminho.style.strokeDasharray = comprimento;
            caminho.style.strokeDashoffset = comprimento;
            caminho.style.opacity = "1";

            let largura = 0;
            let altura = 0;
            let particulas = [];
            let explosaoFeita = false;
            let vooFinalizado = false;

            function redimensionar() {
                const dpr = Math.min(
                    window.devicePixelRatio || 1, 2
                );

                largura = window.innerWidth;
                altura = window.innerHeight;

                canvas.width = largura * dpr;
                canvas.height = altura * dpr;

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            window.addEventListener(
                "resize", redimensionar
            );

            redimensionar();

            // Converte um ponto do SVG em coordenadas da tela.
            function pontoNaTela(progresso) {
                const ponto = caminho.getPointAtLength(
                    comprimento * progresso
                );

                const posicao = svg.createSVGPoint();
                posicao.x = ponto.x;
                posicao.y = ponto.y;

                const matriz = caminho.getScreenCTM();

                return posicao.matrixTransform(matriz);
            }

            // Cria partículas de brilho.
            function criarParticula(x, y, explosiva = false) {

                const angulo = Math.random() * Math.PI * 2;

                const velocidade = explosiva
                    ? 2 + Math.random() * 8
                    : 0.3 + Math.random() * 1.5;

                particulas.push({
                    x,
                    y,
                    vx: Math.cos(angulo) * velocidade,
                    vy: Math.sin(angulo) * velocidade,
                    vida: 1,
                    queda: explosiva ? 0.045 : -0.01,
                    tamanho: 1 + Math.random() * 3.5,
                    cor: Math.random() > .25
                        ? "#ffd46c"
                        : "#ff8d92"
                });
            }

            // Pequeno rojão dourado no centro.
            function criarExplosao() {
                if (explosaoFeita) return;

                explosaoFeita = true;

                const x = largura / 2;
                const y = altura * .48;

               for (let i = 0; i < 55; i++) {
                    criarParticula(x, y, true);
                }

                // Segunda onda de brilhos.
                setTimeout(() => {
                    for (let i = 0; i < 30; i++) {
                        criarParticula(x, y, true);
                    }
                }, 220);

                svg.classList.add("pronto");
                logo.classList.add("revelado");
                frase.classList.add("visivel");
            }

            // Corações pequenos flutuando.
            for (let i = 0; i < 24; i++) {
                const coracao = document.createElement("span");

                coracao.className = "mini-coracao";
                coracao.textContent = "♥";

                coracao.style.setProperty(
                    "--x", (8 + Math.random() * 84) + "%"
                );

                coracao.style.setProperty(
                    "--y", (10 + Math.random() * 75) + "%"
                );

                coracao.style.setProperty(
                    "--tamanho",
                    (8 + Math.random() * 15) + "px"
                );

                coracao.style.setProperty(
                    "--duracao",
                    (2.5 + Math.random() * 3) + "s"
                );

                coracao.style.setProperty(
                    "--atraso",
                    (-Math.random() * 5) + "s"
                );

                coracoes.appendChild(coracao);
            }

            // Brilhos ambiente.
            for (let i = 0; i < 45; i++) {
                criarParticula(
                    Math.random() * largura,
                    Math.random() * altura
                );
            }

            let ultimoTempo = performance.now();
            let animacaoId;

            function animar(tempo) {
                const delta = Math.min(
                    (tempo - ultimoTempo) / 16.67, 2
                );

                ultimoTempo = tempo;

                ctx.clearRect(0, 0, largura, altura);

                const progresso = Math.max(
                    0,
                    Math.min(
                        (tempo - inicioVoo) / duracaoVoo,
                        1
                    )
                );

                // Borboleta acompanha o próprio coração.
                if (tempo >= inicioVoo &&
                    progresso < 1 &&
                    !vooFinalizado) {

                    const ponto = pontoNaTela(progresso);

                    const proximo = pontoNaTela(
                        Math.min(progresso + .003, 1)
                    );

                    const angulo = Math.atan2(
                        proximo.y - ponto.y,
                        proximo.x - ponto.x
                    ) * 180 / Math.PI;

                    borboleta.style.opacity = "1";

                    borboleta.style.transform =
                        `translate(${ponto.x - 38}px,
                                   ${ponto.y - 32}px)
                         rotate(${angulo + 90}deg)`;

                    caminho.style.strokeDashoffset =
                        comprimento * (1 - progresso);

                    // Rastro dourado seguindo a borboleta.
                    for (let i = 0; i < 2; i++) {
                        criarParticula(
                            ponto.x + (Math.random() - .5) * 16,
                            ponto.y + (Math.random() - .5) * 16
                        );
                    }

                } else if (progresso >= 1 &&
                           !vooFinalizado) {

                    vooFinalizado = true;
                    borboleta.style.opacity = "0";
                    caminho.style.strokeDashoffset = 0;

                    criarExplosao();
                }

                // Movimento das partículas.
                ctx.globalCompositeOperation = "lighter";

                particulas = particulas.filter(p => {
                    p.x += p.vx * delta;
                    p.y += p.vy * delta;
                    p.vy += p.queda * delta;
                    p.vida -= .012 * delta;

                    if (p.vida <= 0) return false;

                    ctx.globalAlpha = Math.max(0, p.vida);
                    ctx.fillStyle = p.cor;
                    
                    ctx.shadowBlur = 3;
                    ctx.shadowColor = p.cor;

                    ctx.beginPath();
                    ctx.arc(
                        p.x, p.y,
                        p.tamanho * Math.max(.2, p.vida),
                        0, Math.PI * 2
                    );
                    ctx.fill();

                    return true;
                });

                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = "source-over";

                // Cria poucos brilhos no fundo.
                // Para de criar partículas quando começa a transição.
                if (!transicao.classList.contains("ativa")
                    && Math.random() < 0.12) {

                    criarParticula(
                     Math.random() * largura,
                    Math.random() * altura
                    );
                }

                // Evita acumular partículas demais.
               if (particulas.length > 140) {
                    particulas.splice(
                    0, particulas.length - 140
                    );
                }

                animacaoId = requestAnimationFrame(animar);
            }

            requestAnimationFrame(animar);

            // Inicia a transformação do emblema em portal.
            setTimeout(() => {
                logo.classList.add("portal");
                transicao.classList.add("ativa");
            }, 6800);

            // Interrompe os efeitos gráficos quando a transição termina.
            setTimeout(() => {
                cancelAnimationFrame(animacaoId);
            }, 8000);

            // Abre a página principal após a finalização.
            setTimeout(() => {
                window.location.replace("./inicio.html");
            }, 8050);
        });
    </script>

</body>
</html>
